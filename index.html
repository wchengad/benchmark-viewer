<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Benchmark Bundle Viewer</title>
    <style>
        :root {
            --panel: rgba(255, 252, 246, 0.94);
            --panel-strong: rgba(255, 255, 255, 0.92);
            --text: #1f1d18;
            --muted: #6d665b;
            --line: rgba(31, 29, 24, 0.14);
            --accent: #1e4d40;
            --accent-soft: rgba(30, 77, 64, 0.12);
            --missing: #b83a2f;
            --shadow: 0 20px 60px rgba(61, 43, 21, 0.12);
            --radius: 22px;
            --mono: "SFMono-Regular", "JetBrains Mono", Consolas, monospace;
            --sans: "Avenir Next", "Segoe UI", "PingFang SC", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--sans);
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(30, 77, 64, 0.12), transparent 36%),
                radial-gradient(circle at top right, rgba(211, 140, 83, 0.18), transparent 28%),
                linear-gradient(180deg, #efe7dc 0%, #f8f4ed 56%, #f2ede5 100%);
        }

        button,
        input {
            font: inherit;
        }

        .shell {
            width: min(1920px, calc(100vw - 24px));
            margin: 16px auto 28px;
        }

        .topbar,
        .category-bar,
        .viewer {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
        }

        .topbar {
            padding: 18px 20px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 18px;
            align-items: center;
        }

        .eyebrow {
            margin: 0 0 8px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            font-size: 11px;
            color: var(--muted);
        }

        .topbar h1 {
            margin: 0;
            font-size: clamp(24px, 3vw, 38px);
            line-height: 1.02;
            letter-spacing: -0.04em;
        }

        .topbar p {
            margin: 10px 0 0;
            color: var(--muted);
            max-width: 72ch;
            line-height: 1.55;
            font-size: 14px;
        }

        .loaded .topbar {
            grid-template-columns: minmax(0, 1fr) auto;
            padding-block: 12px;
        }

        .loaded .topbar-copy p,
        .loaded .dropzone strong,
        .loaded .dropzone span {
            display: none;
        }

        .loaded .topbar h1 {
            font-size: clamp(20px, 2vw, 26px);
        }

        .loaded .dropzone {
            padding-block: 12px;
            min-width: 280px;
        }

        .dropzone {
            border: 1px dashed rgba(31, 29, 24, 0.24);
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(255, 250, 242, 0.96), rgba(243, 236, 226, 0.88));
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: min(440px, 100%);
        }

        .dropzone.dragover {
            border-color: var(--accent);
            background: linear-gradient(135deg, rgba(222, 236, 231, 0.96), rgba(255, 250, 242, 0.92));
        }

        .dropzone strong {
            font-size: 16px;
            line-height: 1.2;
        }

        .dropzone span {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .drop-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .dropzone button,
        .category-tab {
            border: 0;
            background: var(--text);
            color: #fff;
            padding: 10px 16px;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.18s ease, opacity 0.18s ease, background 0.18s ease;
        }

        .dropzone button:hover,
        .category-tab:hover {
            transform: translateY(-1px);
            opacity: 0.92;
        }

        .dropzone button.secondary {
            background: #ede6da;
            color: var(--text);
        }

        .status {
            min-height: 20px;
            color: var(--muted);
            font-size: 13px;
        }

        .category-bar {
            margin-top: 14px;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 16px;
            flex-wrap: wrap;
        }

        .category-header h2 {
            margin: 0;
            font-size: clamp(20px, 2vw, 28px);
            letter-spacing: -0.04em;
        }

        .caption {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.45;
        }

        .category-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .category-tab {
            background: rgba(255, 255, 255, 0.76);
            color: var(--text);
            border: 1px solid transparent;
            padding-inline: 14px;
        }

        .category-tab.active {
            background: var(--accent);
            color: #fff;
            border-color: rgba(30, 77, 64, 0.24);
        }

        .viewer {
            margin-top: 14px;
            padding: 14px;
            min-width: 0;
            min-height: 60vh;
        }

        .samples-board {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sample-row {
            padding: 12px;
            border-radius: 20px;
            border: 1px solid rgba(31, 29, 24, 0.08);
            background: linear-gradient(180deg, rgba(255, 252, 246, 0.95), rgba(244, 236, 226, 0.82));
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sample-head {
            display: grid;
            grid-template-columns: 120px minmax(0, 1fr);
            gap: 12px;
            align-items: start;
        }

        .sample-id {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 28px;
            width: fit-content;
            padding: 6px 10px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-family: var(--mono);
            font-size: 11px;
        }

        .sample-prompt {
            min-width: 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.45;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sample-prompt.empty {
            opacity: 0.7;
        }

        .experiments-strip {
            --card-width: 220px;
            display: flex;
            gap: 12px;
            align-items: stretch;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 2px 2px 8px;
            scroll-snap-type: x proximity;
            overscroll-behavior-x: contain;
            scrollbar-width: thin;
            scrollbar-color: rgba(30, 77, 64, 0.48) rgba(31, 29, 24, 0.08);
        }

        .experiments-strip::-webkit-scrollbar {
            height: 8px;
        }

        .experiments-strip::-webkit-scrollbar-track {
            background: rgba(31, 29, 24, 0.08);
            border-radius: 999px;
        }

        .experiments-strip::-webkit-scrollbar-thumb {
            background: rgba(30, 77, 64, 0.44);
            border-radius: 999px;
        }

        .experiment-card {
            flex: 0 0 var(--card-width);
            width: var(--card-width);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(31, 29, 24, 0.08);
            background: var(--panel-strong);
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .experiment-name {
            padding: 8px 10px 6px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .image-wrap {
            padding: 8px;
            background: linear-gradient(180deg, rgba(243, 237, 227, 0.5), rgba(255, 255, 255, 0.95));
        }

        .image-wrap img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            cursor: zoom-in;
            background: #f4efe6;
        }

        .experiment-card.missing {
            background: rgba(184, 58, 47, 0.05);
            border-color: rgba(184, 58, 47, 0.14);
        }

        .missing-body {
            flex: 1;
            min-height: 180px;
            display: grid;
            place-items: center;
            padding: 16px;
            text-align: center;
            color: var(--missing);
            font-size: 12px;
            line-height: 1.5;
        }

        .empty-state {
            min-height: 240px;
            display: grid;
            place-items: center;
            color: var(--muted);
            text-align: center;
            padding: 36px;
            border: 1px dashed rgba(31, 29, 24, 0.14);
            border-radius: 22px;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(17, 15, 12, 0.92);
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding: 4vh 24px 24px;
            z-index: 10;
        }

        .modal.open {
            display: flex;
        }

        .modal-panel {
            width: min(96vw, 1760px);
            max-height: 92vh;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            color: #f8f4ed;
        }

        .modal-title {
            min-width: 0;
            font-family: var(--mono);
            font-size: 13px;
            line-height: 1.4;
            color: rgba(248, 244, 237, 0.86);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .modal-action {
            border: 1px solid rgba(248, 244, 237, 0.24);
            background: rgba(248, 244, 237, 0.1);
            color: #f8f4ed;
            padding: 7px 10px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 12px;
            line-height: 1;
            min-height: 28px;
            user-select: none;
        }

        .modal-action:hover,
        .modal-action:active {
            background: #f8f4ed;
            color: #17120d;
        }

        .modal-action.active {
            outline: 2px solid rgba(248, 244, 237, 0.72);
            outline-offset: 2px;
        }

        .modal-frame {
            margin: 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .modal-image-stage {
            position: relative;
            border-radius: 18px;
            background: #0c0b08;
            overflow: hidden;
        }

        .modal-frame img {
            width: 100%;
            height: auto;
            max-height: calc(92vh - 96px);
            object-fit: contain;
            object-position: center center;
            display: block;
        }

        .modal-original-image {
            position: absolute;
            inset: 0;
            height: 100%;
            opacity: 0;
            pointer-events: none;
        }

        .modal.show-original .modal-current-image {
            opacity: 0;
        }

        .modal.show-original .modal-original-image {
            opacity: 1;
        }

        .modal-caption {
            min-height: 19px;
            color: #f8f4ed;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: 13px;
            line-height: 19px;
            font-family: var(--mono);
        }

        @media (max-width: 1100px) {
            .topbar {
                grid-template-columns: 1fr;
            }

            .dropzone {
                min-width: 0;
            }

            .sample-head {
                grid-template-columns: 1fr;
            }

            .sample-prompt {
                white-space: normal;
                overflow: visible;
                text-overflow: clip;
            }
        }

        @media (max-width: 720px) {
            .shell {
                width: calc(100vw - 12px);
                margin: 8px auto 18px;
            }

            .topbar,
            .category-bar,
            .viewer {
                border-radius: 18px;
            }

            .category-header {
                align-items: start;
            }

            .experiments-strip {
                --card-width: min(72vw, 280px);
            }

            .modal-toolbar {
                align-items: stretch;
                flex-direction: column;
            }

            .modal-actions {
                justify-content: flex-start;
            }
        }
    </style>
</head>

<body>
    <div class="shell">
        <header class="topbar">
            <div class="topbar-copy">
                <p class="eyebrow">Bundle Viewer</p>
                <h1>图像评测横向对比查看器</h1>
                <p>载入单文件 bundle 后，当前类别里的所有样本会直接按行铺开。每一行对应一个样本，横向依次展示各个方法结果，默认把图片区域尽量放大。</p>
            </div>
            <div id="dropzone" class="dropzone">
                <strong>拖拽 bundle 或直接选择文件</strong>
                <span>只解析 `ZIP_STORED` bundle。载入后用下方类别按钮切换查看。</span>
                <div class="drop-actions">
                    <button id="pickButton" type="button">选择 Bundle</button>
                    <button id="demoButton" class="secondary" type="button">界面说明</button>
                </div>
                <input id="fileInput" type="file" accept=".zip" hidden>
                <div id="status" class="status">等待载入 bundle。</div>
            </div>
        </header>

        <section class="category-bar">
            <div class="category-header">
                <div>
                    <p class="eyebrow">Category</p>
                    <h2 id="viewerTitle">等待载入</h2>
                </div>
                <div id="viewerCaption" class="caption">先选择 bundle。</div>
            </div>
            <div id="categoryTabs" class="category-tabs"></div>
        </section>

        <main class="viewer">
            <div id="samplesBoard" class="samples-board">
                <div class="empty-state">载入 bundle 后，这里会直接显示当前类别下的全部样本与各方法图片。</div>
            </div>
        </main>
    </div>

    <div id="modal" class="modal">
        <div class="modal-panel">
            <div class="modal-toolbar">
                <div id="modalTitle" class="modal-title"></div>
                <div class="modal-actions">
                    <button id="modalOriginalButton" class="modal-action" type="button">原图</button>
                    <button id="modalCloseButton" class="modal-action" type="button">关闭</button>
                </div>
            </div>
            <figure class="modal-frame">
                <div class="modal-image-stage">
                    <img id="modalImage" class="modal-current-image" alt="">
                    <img id="modalOriginalImage" class="modal-original-image" alt="">
                </div>
                <figcaption class="modal-caption">
                    <span id="modalLeft"></span>
                    <span id="modalRight"></span>
                </figcaption>
            </figure>
        </div>
    </div>

    <script>
        const state = {
            archive: null,
            manifest: null,
            bundleFile: null,
            currentCategoryId: null,
            activeObjectUrls: [],
            renderToken: 0,
            modal: {
                showingOriginal: false,
                currentUrl: "",
                originalUrl: "",
                currentLabel: "",
                originalLabel: "",
                sampleLabel: "",
            },
        };

        const refs = {
            dropzone: document.getElementById("dropzone"),
            fileInput: document.getElementById("fileInput"),
            pickButton: document.getElementById("pickButton"),
            demoButton: document.getElementById("demoButton"),
            status: document.getElementById("status"),
            viewerTitle: document.getElementById("viewerTitle"),
            viewerCaption: document.getElementById("viewerCaption"),
            categoryTabs: document.getElementById("categoryTabs"),
            samplesBoard: document.getElementById("samplesBoard"),
            modal: document.getElementById("modal"),
            modalTitle: document.getElementById("modalTitle"),
            modalImage: document.getElementById("modalImage"),
            modalOriginalImage: document.getElementById("modalOriginalImage"),
            modalLeft: document.getElementById("modalLeft"),
            modalRight: document.getElementById("modalRight"),
            modalOriginalButton: document.getElementById("modalOriginalButton"),
            modalCloseButton: document.getElementById("modalCloseButton"),
        };

        function setStatus(message, isError = false) {
            refs.status.textContent = message;
            refs.status.style.color = isError ? "var(--missing)" : "var(--muted)";
        }

        function readUInt16(view, offset) {
            return view.getUint16(offset, true);
        }

        function readUInt32(view, offset) {
            return view.getUint32(offset, true);
        }

        function findEndOfCentralDirectory(bytes) {
            const minOffset = Math.max(0, bytes.length - 0xffff - 22);
            for (let offset = bytes.length - 22; offset >= minOffset; offset -= 1) {
                if (
                    bytes[offset] === 0x50 &&
                    bytes[offset + 1] === 0x4b &&
                    bytes[offset + 2] === 0x05 &&
                    bytes[offset + 3] === 0x06
                ) {
                    return offset;
                }
            }
            throw new Error("无法找到 ZIP 结束目录，文件可能不是标准 zip。");
        }

        function parseStoredZip(arrayBuffer) {
            const bytes = new Uint8Array(arrayBuffer);
            const view = new DataView(arrayBuffer);
            const decoder = new TextDecoder("utf-8");
            const eocdOffset = findEndOfCentralDirectory(bytes);
            const entryCount = readUInt16(view, eocdOffset + 10);
            const centralDirectoryOffset = readUInt32(view, eocdOffset + 16);

            const entries = new Map();
            let cursor = centralDirectoryOffset;

            for (let index = 0; index < entryCount; index += 1) {
                const signature = readUInt32(view, cursor);
                if (signature !== 0x02014b50) {
                    throw new Error("中央目录签名异常，无法解析 bundle。");
                }

                const compressionMethod = readUInt16(view, cursor + 10);
                const compressedSize = readUInt32(view, cursor + 20);
                const fileNameLength = readUInt16(view, cursor + 28);
                const extraLength = readUInt16(view, cursor + 30);
                const commentLength = readUInt16(view, cursor + 32);
                const localHeaderOffset = readUInt32(view, cursor + 42);
                const fileNameStart = cursor + 46;
                const fileNameEnd = fileNameStart + fileNameLength;
                const fileName = decoder.decode(bytes.slice(fileNameStart, fileNameEnd));

                if (compressionMethod !== 0) {
                    throw new Error(`bundle 中的 ${fileName} 使用了压缩方法 ${compressionMethod}，查看器只支持 ZIP_STORED。`);
                }

                const localSignature = readUInt32(view, localHeaderOffset);
                if (localSignature !== 0x04034b50) {
                    throw new Error(`本地文件头损坏: ${fileName}`);
                }

                const localNameLength = readUInt16(view, localHeaderOffset + 26);
                const localExtraLength = readUInt16(view, localHeaderOffset + 28);
                const dataOffset = localHeaderOffset + 30 + localNameLength + localExtraLength;

                entries.set(fileName, {
                    name: fileName,
                    compressedSize,
                    dataOffset,
                });

                cursor = fileNameEnd + extraLength + commentLength;
            }

            return {
                getEntry(name) {
                    const entry = entries.get(name);
                    if (!entry) {
                        throw new Error(`bundle 缺少条目: ${name}`);
                    }
                    return entry;
                },
                getBytes(name) {
                    const entry = this.getEntry(name);
                    return bytes.slice(entry.dataOffset, entry.dataOffset + entry.compressedSize);
                },
                getText(name) {
                    return decoder.decode(this.getBytes(name));
                },
                createObjectUrl(name, mimeType) {
                    const blob = new Blob([this.getBytes(name)], { type: mimeType || "application/octet-stream" });
                    return URL.createObjectURL(blob);
                },
            };
        }

        function getCurrentCategory() {
            if (!state.manifest || !state.currentCategoryId) {
                return null;
            }
            return state.manifest.categories.find((item) => item.id === state.currentCategoryId) || null;
        }

        function revokeActiveUrls() {
            for (const url of state.activeObjectUrls) {
                URL.revokeObjectURL(url);
            }
            state.activeObjectUrls = [];
        }

        function getCompactPrompt(sample) {
            const firstEntry = Object.entries(sample.meta || {}).find(([, value]) => value !== null && value !== undefined && String(value).trim());
            if (!firstEntry) {
                return "无 prompt";
            }
            return String(firstEntry[1]).replace(/\s+/g, " ").trim();
        }

        function updateExperimentStripLayout(strip) {
            const experimentCount = Math.max(1, Number(strip.dataset.experimentCount || 1));
            const containerWidth = strip.clientWidth || refs.samplesBoard.clientWidth || window.innerWidth;
            const gap = 12;
            const widthPerCard = Math.floor((containerWidth - gap * (experimentCount - 1)) / experimentCount);
            const cardWidth = Math.max(160, Math.min(320, widthPerCard));
            strip.style.setProperty("--card-width", `${cardWidth}px`);
        }

        function updateAllStripLayouts() {
            const strips = refs.samplesBoard.querySelectorAll(".experiments-strip");
            for (const strip of strips) {
                updateExperimentStripLayout(strip);
            }
        }

        function renderCategoryTabs() {
            refs.categoryTabs.innerHTML = "";
            if (!state.manifest) {
                return;
            }

            for (const category of state.manifest.categories) {
                const button = document.createElement("button");
                button.type = "button";
                button.className = `category-tab${category.id === state.currentCategoryId ? " active" : ""}`;
                button.textContent = category.id;
                button.addEventListener("click", async () => {
                    if (category.id === state.currentCategoryId) {
                        return;
                    }
                    state.currentCategoryId = category.id;
                    renderCategoryTabs();
                    await renderCategoryView();
                    window.scrollTo({ top: 0, behavior: "smooth" });
                });
                refs.categoryTabs.appendChild(button);
            }
        }

        function createExperimentCard(category, sample, experiment, experimentData, originalImage) {
            const card = document.createElement("article");
            card.className = "experiment-card";

            const title = document.createElement("div");
            title.className = "experiment-name";
            title.textContent = experiment.label;
            card.appendChild(title);

            if (!experimentData || !experimentData.image) {
                card.classList.add("missing");
                const missingBody = document.createElement("div");
                missingBody.className = "missing-body";
                missingBody.textContent = "缺失";
                card.appendChild(missingBody);
                return card;
            }

            const imageUrl = originalImage?.experimentId === experiment.id
                ? originalImage.url
                : state.archive.createObjectUrl(experimentData.image.bundlePath, "image/avif");
            if (originalImage?.experimentId !== experiment.id) {
                state.activeObjectUrls.push(imageUrl);
            }

            const imageWrap = document.createElement("div");
            imageWrap.className = "image-wrap";
            imageWrap.innerHTML = `<img loading="lazy" src="${imageUrl}" alt="">`;

            const imageNode = imageWrap.querySelector("img");
            imageNode.alt = `${category.id} / ${sample.id} / ${experiment.label}`;
            imageNode.addEventListener("click", () => {
                openModal({
                    currentUrl: imageUrl,
                    originalUrl: originalImage?.url || imageUrl,
                    sampleLabel: `${category.id} / ${sample.id}`,
                    currentLabel: experiment.label,
                    originalLabel: originalImage?.label || experiment.label,
                });
            });

            card.appendChild(imageWrap);
            return card;
        }

        async function renderCategoryView() {
            const category = getCurrentCategory();
            revokeActiveUrls();
            refs.samplesBoard.innerHTML = "";
            const renderToken = ++state.renderToken;

            if (!category) {
                refs.viewerTitle.textContent = "没有可展示的类别";
                refs.viewerCaption.textContent = "请先载入 bundle。";
                refs.samplesBoard.innerHTML = `<div class="empty-state">当前没有类别数据。</div>`;
                return;
            }

            refs.viewerTitle.textContent = category.id;
            refs.viewerCaption.textContent = `${category.sampleCount} 个样本，${state.manifest.experiments.length} 个方法。每个样本单独成行，横向对比。`;

            if (!category.samples || category.samples.length === 0) {
                refs.samplesBoard.innerHTML = `<div class="empty-state">当前类别没有样本。</div>`;
                return;
            }

            const fragment = document.createDocumentFragment();

            for (const sample of category.samples) {
                if (renderToken !== state.renderToken) {
                    return;
                }

                const row = document.createElement("section");
                row.className = "sample-row";

                const head = document.createElement("div");
                head.className = "sample-head";

                const idTag = document.createElement("span");
                idTag.className = "sample-id";
                idTag.textContent = sample.id;

                const prompt = document.createElement("div");
                prompt.className = "sample-prompt";
                const promptText = getCompactPrompt(sample);
                prompt.textContent = promptText;
                if (promptText === "无 prompt") {
                    prompt.classList.add("empty");
                }

                head.appendChild(idTag);
                head.appendChild(prompt);
                row.appendChild(head);

                const strip = document.createElement("div");
                strip.className = "experiments-strip";
                strip.dataset.experimentCount = String(state.manifest.experiments.length);

                const firstExperiment = state.manifest.experiments[0] || null;
                const firstExperimentData = firstExperiment ? sample.experiments?.[firstExperiment.id] || null : null;
                let originalImage = null;
                if (firstExperimentData?.image) {
                    const originalUrl = state.archive.createObjectUrl(firstExperimentData.image.bundlePath, "image/avif");
                    state.activeObjectUrls.push(originalUrl);
                    originalImage = {
                        url: originalUrl,
                        label: firstExperiment.label,
                        experimentId: firstExperiment.id,
                    };
                }

                for (const experiment of state.manifest.experiments) {
                    const experimentData = sample.experiments?.[experiment.id] || null;
                    strip.appendChild(createExperimentCard(category, sample, experiment, experimentData, originalImage));
                }

                row.appendChild(strip);
                fragment.appendChild(row);
            }

            refs.samplesBoard.appendChild(fragment);
            requestAnimationFrame(() => updateAllStripLayouts());
        }

        async function renderAll() {
            renderCategoryTabs();
            await renderCategoryView();
        }

        async function loadBundle(file) {
            try {
                setStatus(`正在读取 ${file.name} ...`);
                const arrayBuffer = await file.arrayBuffer();
                const archive = parseStoredZip(arrayBuffer);
                const manifest = JSON.parse(archive.getText("manifest.json"));

                state.archive = archive;
                state.manifest = manifest;
                state.bundleFile = file;
                state.currentCategoryId = manifest.categories[0]?.id || null;
                document.body.classList.add("loaded");

                await renderAll();
                setStatus(`已载入 ${file.name}，可以直接切换类别查看。`);
            } catch (error) {
                console.error(error);
                document.body.classList.remove("loaded");
                setStatus(error.message || "载入失败。", true);
                refs.categoryTabs.innerHTML = "";
                refs.viewerTitle.textContent = "载入失败";
                refs.viewerCaption.textContent = "请检查 bundle 格式。";
                refs.samplesBoard.innerHTML = `<div class="empty-state">无法读取当前 bundle。</div>`;
            }
        }

        function showModalOriginal(showOriginal) {
            if (!refs.modal.classList.contains("open")) {
                return;
            }

            state.modal.showingOriginal = showOriginal;
            refs.modal.classList.toggle("show-original", showOriginal);
            refs.modalOriginalButton.classList.toggle("active", showOriginal);
        }

        function openModal(detail) {
            state.modal = {
                showingOriginal: false,
                currentUrl: detail.currentUrl,
                originalUrl: detail.originalUrl || detail.currentUrl,
                currentLabel: detail.currentLabel || "本图",
                originalLabel: detail.originalLabel || "原图",
                sampleLabel: detail.sampleLabel || "",
            };

            refs.modalTitle.textContent = state.modal.sampleLabel;
            refs.modalLeft.textContent = state.modal.sampleLabel;
            refs.modalRight.textContent = state.modal.currentLabel;
            refs.modalImage.src = state.modal.currentUrl;
            refs.modalOriginalImage.src = state.modal.originalUrl;
            refs.modal.classList.add("open");
            showModalOriginal(false);
        }

        function closeModal() {
            refs.modal.classList.remove("open");
            refs.modal.classList.remove("show-original");
            refs.modalImage.removeAttribute("src");
            refs.modalOriginalImage.removeAttribute("src");
            state.modal.showingOriginal = false;
            refs.modalOriginalButton.classList.remove("active");
        }

        refs.pickButton.addEventListener("click", () => refs.fileInput.click());

        refs.fileInput.addEventListener("change", async (event) => {
            const file = event.target.files?.[0];
            if (file) {
                await loadBundle(file);
            }
        });

        refs.demoButton.addEventListener("click", () => {
            setStatus("载入后顶部只保留类别切换，主区域会把当前类别所有样本按行展开。");
        });

        refs.dropzone.addEventListener("dragover", (event) => {
            event.preventDefault();
            refs.dropzone.classList.add("dragover");
        });

        refs.dropzone.addEventListener("dragleave", () => {
            refs.dropzone.classList.remove("dragover");
        });

        refs.dropzone.addEventListener("drop", async (event) => {
            event.preventDefault();
            refs.dropzone.classList.remove("dragover");
            const file = event.dataTransfer?.files?.[0];
            if (file) {
                await loadBundle(file);
            }
        });

        refs.modalOriginalButton.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            showModalOriginal(true);
        });
        refs.modalOriginalButton.addEventListener("pointerup", () => showModalOriginal(false));
        refs.modalOriginalButton.addEventListener("pointerleave", () => showModalOriginal(false));
        refs.modalOriginalButton.addEventListener("pointercancel", () => showModalOriginal(false));
        window.addEventListener("pointerup", () => showModalOriginal(false));
        refs.modalCloseButton.addEventListener("click", () => closeModal());

        refs.modal.addEventListener("click", (event) => {
            if (event.target === refs.modal) {
                closeModal();
            }
        });

        document.addEventListener("keydown", (event) => {
            const isModalOpen = refs.modal.classList.contains("open");
            if (event.key === "Escape") {
                closeModal();
            } else if (isModalOpen && event.code === "Space") {
                event.preventDefault();
                showModalOriginal(true);
            }
        });

        document.addEventListener("keyup", (event) => {
            const isModalOpen = refs.modal.classList.contains("open");
            if (isModalOpen && event.code === "Space") {
                event.preventDefault();
                showModalOriginal(false);
            }
        });

        window.addEventListener("resize", () => {
            if (state.manifest) {
                updateAllStripLayouts();
            }
        });
    </script>
</body>

</html>
